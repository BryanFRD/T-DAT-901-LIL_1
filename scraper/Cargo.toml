[package]
name = "scraper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "scraper"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12.23", features = ["json"] }
tokio = { version = "1.44", features = ["full"] }
scraper = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
log = "0.4"
env_logger = "0.11"
colored = "3.0.0"
prometheus = "0.14.0"
lazy_static = "1.4"
once_cell = "1.21.3"
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
